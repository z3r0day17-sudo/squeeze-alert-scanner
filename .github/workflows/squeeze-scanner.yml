name: Squeeze Scanner

on:
  schedule:
    # Run every 15 minutes, Monday-Friday.
    # scanner.py handles the actual 9:30 AM-4:00 PM ET market-hours check.
    - cron: "*/15 * * * 1-5"

  # Allows manual testing from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dynamic Squeeze Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scanner.py
