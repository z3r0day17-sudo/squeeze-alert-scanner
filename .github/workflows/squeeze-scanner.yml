name: Squeeze Scanner

on:
  schedule:
    # Run every 15 minutes on weekdays.
    # scanner.py decides whether the U.S. market is actually open.
    - cron: "*/15 * * * 1-5"

  # Lets you run the scanner manually from GitHub Actions.
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Squeeze Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scanner.py
